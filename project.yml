name: Ayah
options:
  bundleIdPrefix: com.malek
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Xcode 26 Debug builds otherwise produce a Previews stub executor whose
    # widget extension never runs the real code outside of Xcode.
    ENABLE_DEBUG_DYLIB: NO
targets:
  Ayah:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malek.ayah
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Ayah
      # Widget configuration intents must also be compiled into the containing
      # app so chronod can resolve the stored configuration (the app bundle
      # gets its own Metadata.appintents, like every widget-shipping app).
      - AyahWidget/AyahConfigIntent.swift
      - AyahWidget/VerseStore.swift
      - AyahWidget/Trace.swift
    info:
      path: Ayah/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ayah
        CFBundleURLTypes:
          - CFBundleURLName: com.malek.ayah
            CFBundleURLSchemes: [ayah]
    entitlements:
      path: Ayah/Ayah.entitlements
      properties:
        com.apple.security.app-sandbox: true
    dependencies:
      - target: AyahWidget
        embed: true
        codeSign: true
  AyahWidget:
    type: extensionkit-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malek.ayah.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - AyahWidget
      - path: Ayah/Assets.xcassets
        buildPhase: resources
    info:
      path: AyahWidget/Info.plist
      properties:
        CFBundleDisplayName: Ayah
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AyahWidget/AyahWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
  VerseSelectionTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests
      - AyahWidget/VerseStore.swift
      - path: AyahWidget/Verses.json
        buildPhase: resources
schemes:
  Ayah:
    build:
      targets:
        Ayah: all
        VerseSelectionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VerseSelectionTests]
