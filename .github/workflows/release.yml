name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # release.sh derives the version and build number from git history.
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, test, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/release.sh --publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayah-app
          path: dist/*.zip
